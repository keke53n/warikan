<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>割り勘アプリ</title>
<meta name="description" content="ルームを閉じずに部分的に精算でき、月ごとの使用額も残せる個人用の割り勘アプリです。">
<style>
  :root { --bg: #f5f8f7; --ink: #1d2a2d; --muted: #56676b; --line: #d4dfdc; --accent: #276f61; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a1b; --ink: #e6eeec; --muted: #a2b3b0; --line: #2b3a3b; --accent: #7cc6b5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.8;
  }
  main { max-width: 38rem; margin: 0 auto; padding: 4.5rem 1.5rem 3rem; }
  h1 { font-size: 2rem; line-height: 1.3; margin: 0 0 1.5rem; letter-spacing: 0.02em; }
  p { margin: 0 0 1rem; }
  .note { color: var(--muted); }
  .status {
    display: inline-block; margin: 0.75rem 0 0; padding: 0.2rem 0.8rem;
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 0.875rem;
  }
  footer { border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1rem; font-size: 0.875rem; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>割り勘アプリ</h1>
  <p>ルームを閉じずに、これまでの分や特定の支払いだけを精算できる割り勘アプリです。精算しても記録は消えないので、月ごとの使用額をいつでも確認できます。</p>
  <p class="note">管理者と身近なメンバーだけで使う、個人用のアプリです。</p>
  <p class="status">ただいま準備中です</p>
  <footer>
    <a href="privacy.html">プライバシーポリシー</a>
  </footer>
</main>
</body>
</html>
